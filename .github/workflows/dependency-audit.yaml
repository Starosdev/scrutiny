name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  merge_group:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/frontend/package-lock.json

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Audit release tooling
        run: npm audit --audit-level=low

      - name: Install frontend dependencies
        working-directory: webapp/frontend
        run: npm ci --ignore-scripts

      - name: Audit frontend dependencies
        working-directory: webapp/frontend
        run: npm audit --audit-level=low

  go-vulnerability:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
