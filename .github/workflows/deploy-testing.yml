name: Publish Testing Image

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    name: Build and Publish Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Normalize image name
        id: image_name
        run: |
          set -euo pipefail
          echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push testing image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}:develop
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}:develop-omnibus
          cache-from: type=gha,scope=testing-omnibus
          cache-to: type=gha,mode=max,scope=testing-omnibus

      # The all-in-one image above starts its collectors from
      # rootfs/etc/services.d, so it cannot exercise a change to any
      # docker/entrypoint-collector*.sh script. Without this second image a
      # collector-side fix has no testing tag at all, and a reporter has nothing
      # to try before the next stable release.
      #
      # amd64 only, deliberately. This image installs zfsutils-linux, mdadm,
      # btrfs-progs and fio, and emulating that build for arm64 under QEMU would
      # dominate the runtime of every develop push. Stable releases still publish
      # both architectures.
      - name: Build and push testing collector-omnibus image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: .
          file: docker/Dockerfile.collector-omnibus
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}:develop-collector-omnibus
          cache-from: type=gha,scope=testing-collector-omnibus
          cache-to: type=gha,mode=max,scope=testing-collector-omnibus
