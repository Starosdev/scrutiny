# GHAS-free dependency and filesystem scanning with Trivy.
# Reports stay in private short-retention artifacts.
# Findings remain report-only until owner-reviewed gate enrollment.

name: Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          path: '.'
          format: 'json'
          output: 'trivy-summary.json'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          path: '.'
          format: 'cyclonedx'
          output: 'trivy-sbom.cdx.json'
          exit-code: '0'

      - name: Redact Trivy reports
        if: always()
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/trivy-artifact"
          mkdir -p "$artifact_dir"
          redact='walk(
            if type == "object" then
              with_entries(
                if (.key | ascii_downcase | test("secret|match|password|token|authorization|private[_-]?key"))
                then .value = "[REDACTED]"
                else .
                end
              )
            else .
            end
          )'
          if [[ -s trivy-summary.json ]]; then
            jq "$redact" trivy-summary.json > "$artifact_dir/trivy.redacted.json"
          else
            printf '%s\n' '{"scanner":"trivy","status":"not-run"}' > "$artifact_dir/trivy.redacted.json"
          fi
          if [[ -s trivy-sbom.cdx.json ]]; then
            jq "$redact" trivy-sbom.cdx.json > "$artifact_dir/trivy.sbom.cdx.redacted.json"
          fi

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-scan-results
          path: ${{ runner.temp }}/trivy-artifact
          retention-days: 7
          if-no-files-found: error

      - name: Display vulnerability summary
        if: always()
        run: |
          echo "=== Vulnerability Summary ==="

          if [ -s trivy-summary.json ]; then
            CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-summary.json)
            HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-summary.json)
            MEDIUM_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-summary.json)

            echo "Critical: $CRITICAL_COUNT"
            echo "High: $HIGH_COUNT"
            echo "Medium: $MEDIUM_COUNT"

            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo ""
              echo "=== CRITICAL Vulnerabilities ==="
              jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL") | "- \(.VulnerabilityID): \(.PkgName) \(.InstalledVersion) (Fixed: \(.FixedVersion // "N/A"))"' trivy-summary.json | head -20
            fi

            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo ""
              echo "=== HIGH Vulnerabilities ==="
              jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH") | "- \(.VulnerabilityID): \(.PkgName) \(.InstalledVersion) (Fixed: \(.FixedVersion // "N/A"))"' trivy-summary.json | head -20
            fi
          else
            echo "No summary file found"
          fi

      - name: Check for blocking vulnerabilities
        if: always()
        run: |
          if [ -s trivy-summary.json ]; then
            CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-summary.json 2>/dev/null || echo "0")
            HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-summary.json 2>/dev/null || echo "0")

            echo ""
            echo "Security Gate:"

            if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
              echo "  Found $CRITICAL_COUNT critical and $HIGH_COUNT high vulnerabilities"

              if [ "${{ github.event_name }}" = "pull_request" ]; then
                echo ""
                echo "  REPORT-ONLY: findings are retained for issue aggregation"
              else
                echo ""
                echo "  REPORT-ONLY: scheduled scan found critical or high vulnerabilities"
              fi
            else
              echo "  No critical vulnerabilities found"
            fi
          else
            echo "  ERROR: No trivy-summary.json found - scanner failed"
            exit 1
          fi

          echo ""
          echo "Security scan completed"

  iac:
    name: Trivy IaC Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy IaC scanner (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'json'
          output: 'trivy-iac-summary.json'
          severity: 'CRITICAL,HIGH'
          scanners: 'misconfig'
          exit-code: '0'

      - name: Redact Trivy IaC report
        if: always()
        run: |
          set -euo pipefail
          if [[ -s trivy-iac-summary.json ]]; then
            jq '
              walk(
                if type == "object" then
                  with_entries(
                    if (.key | ascii_downcase | test("secret|match|password|token|authorization|private[_-]?key"))
                    then .value = "[REDACTED]"
                    else .
                    end
                  )
                else .
                end
              )
            ' trivy-iac-summary.json > "$RUNNER_TEMP/trivy-iac.redacted.json"
          else
            printf '%s\n' '{"scanner":"trivy","scan_type":"config","status":"not-run"}' > "$RUNNER_TEMP/trivy-iac.redacted.json"
          fi

      - name: Upload Trivy IaC results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-iac-scan-results
          path: ${{ runner.temp }}/trivy-iac.redacted.json
          retention-days: 7
          if-no-files-found: error
