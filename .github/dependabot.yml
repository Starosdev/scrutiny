# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/webapp/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @angular/compiler-cli 22.2 requires typescript >=6.0 <6.1. Remove this
      # when the Angular release in use accepts a newer TypeScript (#877).
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # karma-jasmine 5.1, the latest release, depends on jasmine-core ^4.1, and
      # jasmine-core 5 and later breaks the zone.js test patch under Karma.
      # Remove this after moving the frontend tests off Karma (#763).
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
    # Group minor and patch updates to reduce PR noise
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
      # The dependency-type match claims every devDependency, and it wins over
      # the angular group above, so without these exclusions the Angular build
      # tooling is capped at minor and patch while the runtime packages take
      # the major. That split is what left @angular/build on 21 against Angular
      # 22 and broke the frontend test job.
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # Docker
  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
